<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo Classic · artist enrichment mockup</title>
<style>
:root{--a:#0678b7;--bg:#f2f2f7;--panel:#fff;--chrome:#f7f7f8;--text:#171719;--muted:#696970;--line:#c9c9cf;--soft:#ededf0;--bad:#b32038;--ok:#25724f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.42 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#dfe3e7;color:var(--text)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--a);outline-offset:2px}.bar{padding:10px 16px;background:#20252b;color:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar strong{margin-right:auto}.bar label{font-size:12px;color:#d8dde2}.bar select,.bar button{margin-left:6px;height:34px;padding:0 10px;border:1px solid #7d858d;border-radius:5px;background:#343a41;color:white}.stage{padding:20px;display:grid;place-items:center;min-height:calc(100vh - 54px)}.device{width:min(100%,980px);height:710px;display:grid;grid-template-rows:48px 1fr 54px;background:var(--panel);border:1px solid #969da4;border-radius:12px;overflow:hidden;box-shadow:0 16px 42px #0003}.device.narrow{width:390px;height:740px}.nav{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--line);color:var(--a)}.nav button{width:52px;height:44px;border:0;background:none;color:var(--a);font-size:22px}.nav b{flex:1;text-align:center}.view{overflow:auto;background:var(--bg)}.hero{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;padding:24px;background:var(--panel);border-bottom:1px solid var(--line)}.portrait{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#25262a,#76777c);display:grid;place-items:center;color:white;font-size:38px}.hero h1{font-size:27px;margin:5px 0 2px}.scope{color:var(--muted);font-size:13px}.new{display:inline-block;margin-left:7px;padding:2px 5px;border:1px solid var(--a);border-radius:4px;color:var(--a);font:700 9px/1.2 ui-monospace,monospace;letter-spacing:.12em;vertical-align:2px}.bio{margin:12px 0 6px;max-width:68ch}.source{color:var(--muted);font-size:12px}.source a{color:var(--a)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools button,.action{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--a);padding:0 12px}.section{margin-top:12px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.head{display:flex;align-items:baseline;gap:8px;padding:14px 20px 9px}.head h2{font-size:17px;margin:0}.head span{color:var(--muted);font-size:12px}.albums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:6px 20px 20px}.album{min-width:0}.cover{aspect-ratio:1;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:26px}.album b,.album small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album b{margin-top:6px}.album small{color:var(--muted)}.remote{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 20px;border-top:1px solid var(--line)}.remote .copy{min-width:0;flex:1}.remote b,.remote small{display:block}.remote small{color:var(--muted)}.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}.state{margin:12px 20px 20px;padding:16px 0;border-top:1px solid var(--line)}.state h3{margin:0 0 5px}.state p{color:var(--muted);margin:0 0 12px}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px}.choice .copy{flex:1}.choice small{display:block;color:var(--muted)}.danger{color:var(--bad)!important}.ok{color:var(--ok)!important}.tabs{display:flex;background:var(--chrome);border-top:1px solid var(--line)}.tabs button{flex:1;border:0;background:none;color:var(--muted)}.tabs .on{color:var(--a);font-weight:600}.dark{--a:#38b7ff;--bg:#111113;--panel:#000;--chrome:#1c1c1e;--text:#f2f2f7;--muted:#aaaab2;--line:#3a3a3e;--soft:#202024}.legacy{--a:#095fc8;--bg:#e5e8ec;--panel:#fff;--chrome:#e1e5e9;--text:#20262c;--muted:#58636e;--line:#aeb6bf;--soft:#dfe3e7}.device.narrow .hero{grid-template-columns:72px minmax(0,1fr);padding:16px;gap:13px}.device.narrow .portrait{width:72px;height:72px;font-size:26px}.device.narrow .hero h1{font-size:22px}.device.narrow .bio,.device.narrow .tools{grid-column:1/-1}.device.narrow .albums{grid-template-columns:repeat(2,minmax(0,1fr));padding:6px 14px 16px}.device.narrow .head,.device.narrow .remote{padding-left:14px;padding-right:14px}.device.narrow .tabs button:nth-child(2),.device.narrow .tabs button:nth-child(3){display:none}@media(max-width:650px){.stage{padding:6px}.bar strong{width:100%}}
</style>
</head>
<body><header class="bar"><strong>ARTMETA-01 · review states</strong><label>State<select id="state"><option value="ready">MusicArtistInfo enriched</option><option value="install">Plugin not installed</option><option value="installing">Installing plugin</option><option value="review">Ambiguous match</option><option value="loading">Loading</option><option value="partial">Provider unavailable</option><option value="offline">Offline cached</option><option value="empty">No safe match</option><option value="removed">Enrichment removed</option></select></label><label>Theme<select id="theme"><option>Light</option><option>Dark</option><option>Legacy</option></select></label><button id="width">Narrow</button></header>
<main class="stage"><section class="device" id="device"><nav class="nav"><button aria-label="Back">‹</button><b>The Beatles</b><button aria-label="More actions">•••</button></nav><div class="view" id="view"></div><nav class="tabs"><button>♡<br>Favourites</button><button>◉<br>Radio</button><button>▦<br>Apps</button><button class="on">♫<br>My Music</button></nav></section></main>
<script>
(function(){var state=document.getElementById('state'),view=document.getElementById('view'),device=document.getElementById('device');
function status(s){var map={install:['Add richer artist information','Music & Artist Information can provide biographies, credited photos, related artists, discographies and album reviews.'],installing:['Installing Music & Artist Information…','LMS Plugin Manager is completing the installation. A server restart may be required.'],loading:['Finding artist information…','Checking MusicArtistInfo and connected services.'],partial:['MusicArtistInfo is temporarily unavailable','Local albums and permitted cached details remain available.'],offline:['Showing saved metadata','Last refreshed 2 days ago. Connect to refresh provider information.'],empty:['No safe metadata match found','The local artist remains unchanged. You can review candidates manually.'],removed:['Enrichment removed','Only information from the local library is shown.']},x=map[s];if(!x)return '';var button=s==='install'?'<button class="action">Install plugin</button>':s==='installing'?'<button class="action" disabled>Installing…</button>':'<button class="action">'+(s==='removed'?'Find metadata':'Try again')+'</button>';return '<div class="state" role="status"><h3>'+x[0]+'</h3><p>'+x[1]+'</p>'+button+(s==='install'?'<p class="source">Music & Artist Information 1.29.2 · installation handled by LMS Plugin Manager</p>':'')+'</div>'}
function hero(s){var enriched=s==='ready'||s==='partial'||s==='offline';return '<header class="hero"><div class="portrait" aria-label="Artist image">♪</div><div><div class="scope">LOCAL LIBRARY <span class="new">NEW</span></div><h1>The Beatles</h1><div class="scope">4 local albums · 56 local tracks</div></div>'+(enriched?'<p class="bio">English rock band formed in Liverpool, presented here as an attributed metadata overlay on the local artist.</p><div class="source">Biography: <a href="#">Wikipedia</a> via MusicArtistInfo · portrait: Discogs, credited · refreshed 2 days ago</div><div class="tools"><button>Refresh</button><button>Review match</button><button>Remove enrichment</button></div>':'')+'</header>'}
function local(){return '<section class="section"><div class="head"><h2>In your local library</h2><span>4 albums</span></div><div class="albums">'+['Abbey Road|1969','Revolver|1966','Let It Be|1970','Rubber Soul|1965'].map(function(x){var p=x.split('|');return '<div class="album" tabindex="0"><div class="cover">♫</div><b>'+p[0]+'</b><small>'+p[1]+' · Local</small></div>'}).join('')+'</div></section>'}
function remote(){return '<section class="section"><div class="head"><h2>Also on connected services</h2><span>Not in local library</span></div><div class="remote"><span class="badge">QOBUZ</span><div class="copy"><b>2023 Edition · Abbey Road</b><small>Matched to your local album · stream from Qobuz</small></div><button class="action">Open</button></div><div class="remote"><span class="badge">TIDAL</span><div class="copy"><b>Provider not connected</b><small>Connect it in Server Settings to include its results.</small></div></div></section>'}
function mai(){return '<section class="section"><div class="head"><h2>More artist information</h2><span>MusicArtistInfo</span></div><div class="remote"><span class="badge">LAST.FM</span><div class="copy"><b>Related artists</b><small>Wings, John Lennon, George Harrison · local matches open in My Music</small></div><button class="action">View</button></div><div class="remote"><span class="badge">DISCOGS</span><div class="copy"><b>External discography</b><small>Kept separate from your 4 local albums</small></div><button class="action">View</button></div><div class="remote"><span class="badge">MAI</span><div class="copy"><b>Album reviews and cover candidates</b><small>Available from each album information screen</small></div></div></section>'}
function review(){return '<section class="section"><div class="head"><h2>Review artist match</h2><span>No metadata applied yet</span></div><div class="state"><p>Two provider artists share this name. Choose only if the album evidence is correct.</p><div class="choices"><div class="choice"><div class="copy"><b>The Beatles</b><small>Qobuz · Abbey Road (1969), Revolver (1966)</small></div><button class="action">Use match</button></div><div class="choice"><div class="copy"><b>The Beatles Revival</b><small>Qobuz · no matching local releases</small></div><button class="action">Use match</button></div><button class="action danger">None of these artists</button></div></div></section>'}
function render(){var s=state.value,h=hero(s)+local();if(s==='review')h+=review();else if(s==='ready')h+=mai()+remote();else h+=status(s);view.innerHTML=h}
state.onchange=render;document.getElementById('theme').onchange=function(){device.classList.remove('dark','legacy');if(this.value!=='Light')device.classList.add(this.value.toLowerCase())};document.getElementById('width').onclick=function(){device.classList.toggle('narrow');this.textContent=device.classList.contains('narrow')?'Wide':'Narrow'};render()}());
</script></body></html>
